---
# Cluster identification
cluster_name: ncv
cluster_domain: ashimov.com

# Common network defaults (override per-host if needed)
node_ip: >-
  {{
    ansible_host
      | default(ansible_facts.get('default_ipv4', {}).get('address', ''))
      | default(inventory_hostname)
  }}

# PKI configuration
pki_generate: true
pki_root: "{{ playbook_dir }}/pki"
pki_python_interpreter: "{{ ansible_playbook_python }}"
pki_target_groups:
  - consul_servers
  - consul_clients
  - nomad_servers
  - nomad_clients
  - vault_servers
pki_ca_common_name: "{{ cluster_name }}-ca"
pki_org: "ASHIMOV"
pki_org_unit: "IT"
pki_country: "KZ"

# Consul cluster-specific settings
consul_datacenter: dc1
consul_retry_join: "{{ groups['consul_servers'] | default([]) | map('extract', hostvars, 'node_ip') | list }}"
consul_encrypt: "{{ vault_consul_encrypt | default('') }}"

# Nomad cluster-specific settings
nomad_region: global
nomad_datacenter: dc1
nomad_retry_join: "{{ groups['nomad_servers'] | default([]) | map('extract', hostvars, 'node_ip') | list }}"
nomad_install_docker: true
nomad_consul_token: "{{ vault_nomad_consul_token | default('') }}"

# Vault cluster-specific settings
vault_storage_backend: consul
vault_consul_token: "{{ vault_consul_token_secret | default('') }}"

# Security settings (enabled by default)
firewall_enabled: true
firewall_backend: auto
firewall_allow_cidrs: []

# Load balancer (optional)
load_balancer_enabled: false
load_balancer_provider: aws

# Nomad jobs (optional)
nomad_jobs_enabled: true
nomad_jobs_dir: "{{ playbook_dir }}/jobs/enabled"
nomad_jobs_tmp_dir: /var/tmp/nomad-jobs
nomad_jobs_nomad_addr: "https://{{ node_ip }}:4646"
nomad_jobs_nomad_token: ""
