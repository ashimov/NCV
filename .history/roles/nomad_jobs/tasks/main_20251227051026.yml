---
- name: Find Nomad job files
  ansible.builtin.find:
    paths: "{{ nomad_jobs_dir }}"
    patterns: "*.hcl"
    file_type: file
    recurse: true
  delegate_to: localhost
  run_once: true
  register: nomad_jobs_files
  when: nomad_jobs_enabled

- name: Build Nomad CLI environment
  ansible.builtin.set_fact:
    nomad_jobs_env: >-
      {{
        {'NOMAD_ADDR': nomad_jobs_nomad_addr}
        | combine(nomad_jobs_nomad_token | length > 0 | ternary({'NOMAD_TOKEN': nomad_jobs_nomad_token}, {}))
        | combine((nomad_tls_enabled | default(false)) | ternary({'NOMAD_CACERT': nomad_tls_dir + '/ca.pem'}, {}))
      }}
  run_once: true
  when: nomad_jobs_enabled

- name: Ensure Nomad jobs temp directory
  ansible.builtin.file:
    path: "{{ nomad_jobs_tmp_dir }}"
    state: directory
    mode: "0750"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  when: nomad_jobs_enabled

- name: Copy Nomad job files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ nomad_jobs_tmp_dir }}/{{ item.path | basename }}"
    mode: "0644"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_files.files | default([]) }}"
  when: nomad_jobs_enabled

- name: Plan Nomad jobs
  ansible.builtin.command: "nomad job plan {{ nomad_jobs_tmp_dir }}/{{ item.path | basename }}"
  environment: "{{ nomad_jobs_env }}"
  register: nomad_jobs_plan
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_files.files | default([]) }}"
  when: nomad_jobs_enabled
  failed_when: false
  no_log: true

- name: Run Nomad jobs
  ansible.builtin.command: "nomad job run {{ nomad_jobs_tmp_dir }}/{{ item.item.path | basename }}"
  environment: "{{ nomad_jobs_env }}"
  changed_when: "'Deployment ID' in item.stdout or 'Job registration successful' in item.stdout"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_plan.results }}"
  when: nomad_jobs_enabled and item.rc in [0, 255]
  no_log: true
