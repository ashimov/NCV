---
vault_version: "1.15.0"
vault_package: vault{% if vault_version is defined and vault_version != 'latest' %}={{ vault_version }}{% endif %}

vault_user: vault
vault_group: vault
vault_config_file: "{{ vault_config_dir }}/vault.hcl"

vault_config_dir: /etc/vault.d
vault_data_dir: /opt/vault
vault_tls_dir: /etc/vault.d/tls

vault_api_addr: "https://{{ ansible_host | default(inventory_hostname) }}:8200"
vault_cluster_addr: "https://{{ ansible_host | default(inventory_hostname) }}:8201"
vault_listener_address: "0.0.0.0:8200"
vault_cluster_listen_address: "0.0.0.0:8201"
vault_ui: true
vault_disable_mlock: false

vault_storage_backend: consul  # consul | raft
vault_consul_address: "127.0.0.1:8500"
vault_consul_token: ""
vault_consul_scheme: "{{ 'https' if (consul_tls_enabled | default(false)) else 'http' }}"
vault_consul_tls_ca_file: "{{ consul_tls_dir }}/ca.pem"
vault_consul_tls_cert_file: "{{ consul_tls_dir }}/cert.pem"
vault_consul_tls_key_file: "{{ consul_tls_dir }}/key.pem"

vault_tls_enabled: true
vault_tls_source: pki
vault_tls_ca_src: "{{ pki_root }}/ca/ca.pem"
vault_tls_cert_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/cert.pem"
vault_tls_key_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/key.pem"
vault_tls_require_client_cert: false

vault_seal_type: none  # none | awskms | gcpckms | transit
vault_seal_config: {}
