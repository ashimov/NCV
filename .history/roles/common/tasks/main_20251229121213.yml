---
- name: Install base packages (Debian)
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"
  become: true

- name: Reset DNF cache (RedHat)
  ansible.builtin.command: dnf -y clean all
  changed_when: false
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Refresh DNF cache (RedHat)
  ansible.builtin.command: dnf -y makecache
  changed_when: false
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Install base packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ common_packages_redhat }}"
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Add HashiCorp GPG key (Debian)
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    mode: "0644"
  when: ansible_facts["os_family"] == "Debian"
  become: true

