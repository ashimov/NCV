---
- name: Ensure nomad group
  ansible.builtin.group:
    name: "{{ nomad_group }}"
    system: true
  become: true

- name: Ensure nomad user
  ansible.builtin.user:
    name: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Nomad package
  ansible.builtin.package:
    name: "{{ nomad_package }}"
    state: present
  become: true

- name: Create Nomad directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
  loop:
    - "{{ nomad_data_dir }}"
    - "{{ nomad_config_dir }}"
    - "{{ nomad_tls_dir }}"
    - "{{ nomad_consul_tls_dir }}"
  become: true

- name: Copy Nomad TLS CA
  ansible.builtin.copy:
    src: "{{ nomad_tls_ca_src }}"
    dest: "{{ nomad_tls_dir }}/ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_tls_enabled
  become: true

- name: Copy Nomad TLS certificate
  ansible.builtin.copy:
    src: "{{ nomad_tls_cert_src }}"
    dest: "{{ nomad_tls_dir }}/cert.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_tls_enabled
  become: true

- name: Copy Nomad TLS key
  ansible.builtin.copy:
    src: "{{ nomad_tls_key_src }}"
    dest: "{{ nomad_tls_dir }}/key.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0600"
  when: nomad_tls_enabled
  become: true
  no_log: true

- name: Copy Consul TLS CA for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_ca_src }}"
    dest: "{{ nomad_consul_tls_dir }}/ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_consul_tls_enabled
  become: true

- name: Copy Consul TLS certificate for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_cert_src }}"
    dest: "{{ nomad_consul_tls_dir }}/cert.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_consul_tls_enabled
  become: true

- name: Copy Consul TLS key for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_key_src }}"
    dest: "{{ nomad_consul_tls_dir }}/key.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0600"
  when: nomad_consul_tls_enabled
  become: true
  no_log: true

- name: Render Nomad configuration
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_file }}"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0640"
  notify: Restart nomad
  become: true
  no_log: true

- name: Enable and start Nomad
  ansible.builtin.systemd:
    name: nomad
    enabled: true
    state: started
  become: true
