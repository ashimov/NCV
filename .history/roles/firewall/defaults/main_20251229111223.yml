---
firewall_enabled: true  # Aligned with group_vars/all.yml
firewall_backend: auto  # auto | ufw | firewalld
firewall_zone: public
firewall_allow_cidrs: []

firewall_ports:
  - {port: 22, proto: tcp}  # SSH
  - {port: 8300, proto: tcp}
  - {port: 8301, proto: tcp}
  - {port: 8301, proto: udp}
  - {port: 8302, proto: tcp}
  - {port: 8302, proto: udp}
  - {port: 8500, proto: tcp}  # Consul HTTP (disabled by default)
  - {port: 8501, proto: tcp}  # Consul HTTPS
  - {port: 8502, proto: tcp}
  - {port: 8600, proto: tcp}
  - {port: 8600, proto: udp}
  - {port: 4646, proto: tcp}
  - {port: 4647, proto: tcp}
  - {port: 4648, proto: tcp}
  - {port: 4648, proto: udp}
  - {port: 8200, proto: tcp}
  - {port: 8201, proto: tcp}
