---
- name: Validate firewall zone
  ansible.builtin.assert:
    that:
      - firewall_zone in ['public', 'internal', 'external', 'dmz', 'work', 'home', 'trusted', 'drop', 'block']
    fail_msg: "Invalid firewall_zone '{{ firewall_zone }}'. Must be a valid firewalld zone."
  when:
    - firewall_enabled
    - firewall_backend == 'firewalld' or (firewall_backend == 'auto' and ansible_facts['os_family'] == 'RedHat')

- name: Select firewall backend
  ansible.builtin.set_fact:
    firewall_backend_effective: >-
      {{
        'ufw' if firewall_backend == 'auto' and ansible_facts['os_family'] == 'Debian'
        else 'firewalld' if firewall_backend == 'auto' and ansible_facts['os_family'] == 'RedHat'
        else firewall_backend
      }}
  when: firewall_enabled

- name: Install ufw
  ansible.builtin.package:
    name: ufw
    state: present
  when: firewall_enabled and firewall_backend_effective == 'ufw'
  become: true

- name: Install firewalld
  ansible.builtin.package:
    name: firewalld
    state: present
  when: firewall_enabled and firewall_backend_effective == 'firewalld'
  become: true

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: firewall_enabled and firewall_backend_effective == 'firewalld'
  become: true

- name: Set ufw defaults
  community.general.ufw:
    direction: incoming
    policy: deny
  when: firewall_enabled and firewall_backend_effective == 'ufw'
  become: true

- name: Allow ufw outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  when: firewall_enabled and firewall_backend_effective == 'ufw'
  become: true

- name: Allow ports with ufw (any source)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ firewall_ports }}"
  when: firewall_enabled and firewall_backend_effective == 'ufw' and firewall_allow_cidrs | length == 0
  become: true

- name: Allow ports with ufw (restricted sources)
  community.general.ufw:
    rule: allow
    port: "{{ item.0.port }}"
    proto: "{{ item.0.proto }}"
    src: "{{ item.1 }}"
  loop: "{{ firewall_ports | product(firewall_allow_cidrs) | list }}"
  when: firewall_enabled and firewall_backend_effective == 'ufw' and firewall_allow_cidrs | length > 0
  become: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: firewall_enabled and firewall_backend_effective == 'ufw'
  become: true

- name: Allow ports with firewalld (any source)
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports }}"
  when: firewall_enabled and firewall_backend_effective == 'firewalld' and firewall_allow_cidrs | length == 0
  become: true

- name: Allow ports with firewalld (restricted sources)
  ansible.posix.firewalld:
    port: "{{ item.0.port }}/{{ item.0.proto }}"
    zone: "{{ firewall_zone }}"
    source: "{{ item.1 }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports | product(firewall_allow_cidrs) | list }}"
  when: firewall_enabled and firewall_backend_effective == 'firewalld' and firewall_allow_cidrs | length > 0
  become: true
