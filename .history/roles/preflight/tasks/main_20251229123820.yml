---
- name: Preflight checks
  when: preflight_enabled | bool
  block:
    - name: Assert minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.14.0', '>=')
        fail_msg: >-
          Ansible version {{ ansible_version.full }} is too old.
          Minimum required: 2.14.0. Please upgrade Ansible.
        success_msg: "Ansible version {{ ansible_version.full }} meets requirements."
      run_once: true
      delegate_to: localhost

    - name: Assert supported OS
      ansible.builtin.assert:
        that:
          - >-
            (
              ansible_facts["os_family"] == "Debian"
              and ansible_facts["distribution"] in preflight_debian_distributions
              and (
                (ansible_facts["distribution"] == "Ubuntu" and ansible_facts["distribution_version"] in preflight_ubuntu_versions)
                or (ansible_facts["distribution"] == "Debian" and ansible_facts["distribution_major_version"] in preflight_debian_versions)
              )
            )
            or
            (
              ansible_facts["os_family"] == "RedHat"
              and ansible_facts["distribution"] in preflight_redhat_distributions
              and ansible_facts["distribution_major_version"] in preflight_redhat_versions
            )
        fail_msg: >-
          Unsupported OS: {{ ansible_facts["distribution"] }}
          {{ ansible_facts["distribution_version"] }}.
          Supported: Ubuntu {{ preflight_ubuntu_versions | join(", ") }},
          Debian {{ preflight_debian_versions | join(", ") }},
          RHEL-family {{ preflight_redhat_versions | join(", ") }}.
        success_msg: "OS {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is supported."

    - name: Assert node_ip is set
      ansible.builtin.assert:
        that:
          - node_ip is defined
          - node_ip | length > 0
        fail_msg: "node_ip is empty. Set ansible_host or node_ip for each host."

    - name: Build node_ip list
      ansible.builtin.set_fact:
        preflight_node_ips: "{{ groups['all'] | difference(['localhost']) | map('extract', hostvars, 'node_ip') | list }}"
      run_once: true

    - name: Assert node_ip values are unique
      ansible.builtin.assert:
        that:
          - preflight_node_ips | length == (preflight_node_ips | unique | length)
        fail_msg: "Duplicate node_ip values found in inventory."
      when: preflight_check_unique_node_ip | bool
      run_once: true

    - name: Assert Consul server group present when needed
      ansible.builtin.assert:
        that:
          - groups.get('consul_servers', []) | length > 0
        fail_msg: "consul_servers group must contain at least one host."
      when: >-
        preflight_require_consul | bool and
        (
          (groups.get('consul_servers', []) | length > 0)
          or (groups.get('consul_clients', []) | length > 0)
        )
      run_once: true

    - name: Assert Nomad server group present when needed
      ansible.builtin.assert:
        that:
          - groups.get('nomad_servers', []) | length > 0
        fail_msg: "nomad_servers group must contain at least one host."
      when: >-
        preflight_require_nomad | bool and
        (
          (groups.get('nomad_servers', []) | length > 0)
          or (groups.get('nomad_clients', []) | length > 0)
        )
      run_once: true

    - name: Assert Vault server group present when required
      ansible.builtin.assert:
        that:
          - groups.get('vault_servers', []) | length > 0
        fail_msg: "vault_servers group must contain at least one host."
      when: preflight_require_vault | bool
      run_once: true

    - name: Assert PKI target groups exist when enabled
      ansible.builtin.assert:
        that:
          - pki_target_groups | length > 0
          - (pki_target_groups | difference(groups.keys() | list)) | length == 0
        fail_msg: "pki_target_groups must reference existing inventory groups."
      when: 
        - preflight_require_pki | bool
        - pki_generate is defined
        - pki_generate | bool
      run_once: true

    - name: Warn when Consul gossip encryption is unset
      ansible.builtin.debug:
        msg: "consul_encrypt is empty; gossip traffic is not encrypted."
      when:
        - preflight_warn_on_insecure_defaults | bool
        - consul_encrypt is defined
        - consul_encrypt | length == 0
      run_once: true
    - name: Check minimum RAM requirement
      ansible.builtin.assert:
        that:
          - ansible_facts['memtotal_mb'] >= preflight_min_ram_mb
        fail_msg: >-
          Insufficient RAM: {{ ansible_facts['memtotal_mb'] }}MB detected.
          Minimum required: {{ preflight_min_ram_mb }}MB.
        success_msg: "RAM check passed: {{ ansible_facts['memtotal_mb'] }}MB available."
      when: preflight_check_resources | bool

    - name: Check minimum disk space
      ansible.builtin.assert:
        that:
          - item.size_available >= (preflight_min_disk_gb * 1024 * 1024 * 1024)
        fail_msg: >-
          Insufficient disk space on {{ item.mount }}:
          {{ (item.size_available / 1024 / 1024 / 1024) | round(2) }}GB available.
          Minimum required: {{ preflight_min_disk_gb }}GB.
        success_msg: >-
          Disk space check passed on {{ item.mount }}:
          {{ (item.size_available / 1024 / 1024 / 1024) | round(2) }}GB available.
      loop: "{{ ansible_facts['mounts'] }}"
      when:
        - preflight_check_resources | bool
        - item.mount == '/' or item.mount == '/opt'

    - name: Check CPU cores
      ansible.builtin.assert:
        that:
          - ansible_facts['processor_vcpus'] >= preflight_min_cpu_cores
        fail_msg: >-
          Insufficient CPU cores: {{ ansible_facts['processor_vcpus'] }} detected.
          Minimum required: {{ preflight_min_cpu_cores }}.
        success_msg: "CPU check passed: {{ ansible_facts['processor_vcpus'] }} cores available."
      when: preflight_check_resources | bool

    - name: Check if required ports are available (Consul)
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 1
      loop:
        - 8300  # Consul server RPC
        - 8301  # Consul Serf LAN
        - 8302  # Consul Serf WAN
        - 8500  # Consul HTTP
        - 8501  # Consul HTTPS
        - 8502  # Consul gRPC
      when:
        - preflight_check_ports | bool
        - inventory_hostname in groups.get('consul_servers', []) or inventory_hostname in groups.get('consul_clients', [])
      ignore_errors: yes
      register: consul_ports_check
      failed_when: false

    - name: Check if required ports are available (Nomad)
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 1
      loop:
        - 4646  # Nomad HTTP
        - 4647  # Nomad RPC
        - 4648  # Nomad Serf
      when:
        - preflight_check_ports | bool
        - inventory_hostname in groups.get('nomad_servers', []) or inventory_hostname in groups.get('nomad_clients', [])
      ignore_errors: yes
      register: nomad_ports_check
      failed_when: false

    - name: Check if required ports are available (Vault)
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: stopped
        timeout: 1
      loop:
        - 8200  # Vault HTTP/HTTPS
        - 8201  # Vault cluster
      when:
        - preflight_check_ports | bool
        - inventory_hostname in groups.get('vault_servers', [])
      ignore_errors: yes
      register: vault_ports_check
      failed_when: false

    - name: Warn about port conflicts
      ansible.builtin.debug:
        msg: >-
          WARNING: Some required ports may already be in use.
          Please verify manually or stop conflicting services before proceeding.
      when:
        - preflight_check_ports | bool
        - (consul_ports_check is defined and consul_ports_check is failed) or
          (nomad_ports_check is defined and nomad_ports_check is failed) or
          (vault_ports_check is defined and vault_ports_check is failed)

    - name: Warn about raw_exec driver risks
      ansible.builtin.assert:
        that:
          - not (nomad_enable_raw_exec | default(false))
        fail_msg: >-
          SECURITY WARNING: raw_exec driver is enabled!
          This allows arbitrary command execution and should only be used in trusted environments.
          Set nomad_enable_raw_exec=false unless absolutely necessary.
        success_msg: "raw_exec driver is disabled (secure default)."
      when: preflight_warn_on_insecure_defaults | bool
      ignore_errors: yes