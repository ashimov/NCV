---
name: CI

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r collections/requirements.yml

      - name: Lint
        run: ./scripts/lint.sh
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for potential secrets in code..."
          # Fail if we find suspicious patterns
          ! grep -r "password.*=.*['\"].*['\"]" \
            --exclude-dir={.git,pki,collections,.github} \
            --exclude="*.md" \
            --exclude="vault.yml.example" \
            . || exit 0
          ! grep -r "BEGIN.*PRIVATE KEY" --exclude-dir={.git,pki,collections} . || exit 0
          echo "✅ No obvious secrets detected."

      - name: Verify .gitignore coverage
        run: |
          echo "Verifying sensitive files are in .gitignore..."
          required_patterns=("pki/" "*.key" "*.pem" "*vault_secrets*.yml" ".vault_pass" "consul_encrypt.key")
          for pattern in "${required_patterns[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "::warning::Pattern '$pattern' not found in .gitignore"
            fi
          done
          echo "✅ Gitignore check complete."
