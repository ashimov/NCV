---
- name: Generate Consul encryption key if not set
  ansible.builtin.command: consul keygen
  register: consul_keygen_result
  changed_when: false
  when:
    - consul_encrypt | length == 0
    - inventory_hostname == groups['consul_servers'][0]
  run_once: true
  become: true

- name: Save consul_encrypt key to file
  ansible.builtin.copy:
    content: "{{ consul_keygen_result.stdout }}"
    dest: "{{ pki_root }}/consul_encrypt.key"
    mode: "0600"
  delegate_to: localhost
  when:
    - consul_encrypt | length == 0
    - consul_keygen_result.stdout is defined
  run_once: true

- name: Set consul_encrypt fact from generated key
  ansible.builtin.set_fact:
    consul_encrypt: "{{ consul_keygen_result.stdout }}"
  when:
    - consul_encrypt | length == 0
    - consul_keygen_result.stdout is defined
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['consul_servers'] + groups.get('consul_clients', []) }}"
  run_once: true

- name: Ensure consul group
  ansible.builtin.group:
    name: "{{ consul_group }}"
    system: true
  become: true

- name: Ensure consul user
  ansible.builtin.user:
    name: "{{ consul_user }}"
    group: "{{ consul_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Consul package
  ansible.builtin.package:
    name: "{{ consul_package }}"
    state: present
  become: true

- name: Create Consul directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  loop:
    - "{{ consul_data_dir }}"
    - "{{ consul_config_dir }}"
    - "{{ consul_tls_dir }}"
  become: true

- name: Verify Consul TLS files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  register: consul_tls_check
  failed_when: not consul_tls_check.stat.exists
  loop:
    - "{{ consul_tls_ca_src }}"
    - "{{ consul_tls_cert_src }}"
    - "{{ consul_tls_key_src }}"
  when: consul_tls_enabled

- name: Copy Consul TLS CA
  ansible.builtin.copy:
    src: "{{ consul_tls_ca_src }}"
    dest: "{{ consul_tls_dir }}/ca.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  when: consul_tls_enabled
  become: true
  notify: Restart consul

- name: Copy Consul TLS certificate
  ansible.builtin.copy:
    src: "{{ consul_tls_cert_src }}"
    dest: "{{ consul_tls_dir }}/cert.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  when: consul_tls_enabled
  become: true
  notify: Restart consul

- name: Copy Consul TLS key
  ansible.builtin.copy:
    src: "{{ consul_tls_key_src }}"
    dest: "{{ consul_tls_dir }}/key.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  when: consul_tls_enabled
  become: true
  no_log: true
  notify: Restart consul

- name: Configure and start Consul service
  block:
    - name: Backup existing Consul configuration
      ansible.builtin.copy:
        src: "{{ consul_config_file }}"
        dest: "{{ consul_config_file }}.backup"
        remote_src: true
        mode: preserve
      when: consul_config_file is file
      failed_when: false
      become: true

    - name: Render Consul configuration
      ansible.builtin.template:
        src: consul.hcl.j2
        dest: "{{ consul_config_file }}"
        owner: "{{ consul_user }}"
        group: "{{ consul_group }}"
        mode: "0640"
      notify: Restart consul
      become: true
      no_log: true

    - name: Validate Consul configuration
      ansible.builtin.command: consul validate {{ consul_config_dir }}
      changed_when: false
      become: true

    - name: Enable and start Consul
      ansible.builtin.systemd:
        name: consul
        enabled: true
        state: started
      become: true

    - name: Apply Consul config changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for Consul to be ready
      ansible.builtin.uri:
        url: >-
          {{
            ('https' if consul_tls_enabled else 'http')
            + '://127.0.0.1:'
            + ((consul_https_port | string) if consul_tls_enabled else (consul_http_port | string))
            + '/v1/status/leader'
          }}
        validate_certs: false
        client_cert: "{{ consul_tls_enabled | ternary(consul_tls_dir + '/cert.pem', omit) }}"
        client_key: "{{ consul_tls_enabled | ternary(consul_tls_dir + '/key.pem', omit) }}"
        status_code: 200
      register: consul_ready
      until: consul_ready.status == 200
      retries: 30
      delay: 2
      when: consul_tls_enabled or not consul_tls_enabled
      become: true

  rescue:
    - name: Restore previous Consul configuration
      ansible.builtin.copy:
        src: "{{ consul_config_file }}.backup"
        dest: "{{ consul_config_file }}"
        remote_src: true
        mode: preserve
      when: consul_config_file is file
      failed_when: false
      become: true

    - name: Restart Consul after restoration
      ansible.builtin.systemd:
        name: consul
        state: restarted
      become: true
      failed_when: false

    - name: Fail with descriptive message
      ansible.builtin.fail:
        msg: "Consul configuration or startup failed. Previous configuration restored."

  always:
    - name: Remove backup file
      ansible.builtin.file:
        path: "{{ consul_config_file }}.backup"
        state: absent
      become: true
      failed_when: false
