---
- name: Set consul_server fact based on inventory group
  ansible.builtin.set_fact:
    consul_server: "{{ inventory_hostname in groups.get('consul_servers', []) }}"

- name: Set consul_bootstrap_expect dynamically
  ansible.builtin.set_fact:
    consul_bootstrap_expect: "{{ groups['consul_servers'] | length }}"
  when: consul_server | bool

- name: Ensure consul group
  ansible.builtin.group:
    name: "{{ consul_group }}"
    system: true
  become: true

- name: Ensure consul user
  ansible.builtin.user:
    name: "{{ consul_user }}"
    group: "{{ consul_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Consul package
  ansible.builtin.package:
    name: "{{ consul_package }}"
    state: present
  become: true

- name: Generate Consul encryption key if not set
  ansible.builtin.command: consul keygen
  register: consul_keygen_result
  changed_when: false
  when:
    - consul_encrypt | length == 0
    - inventory_hostname == groups['consul_servers'][0]
  run_once: true
  become: true

- name: Ensure pki_root directory exists for key storage
  ansible.builtin.file:
    path: "{{ pki_root }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  run_once: true
  when: consul_encrypt | length == 0

- name: Save consul_encrypt key to file
  ansible.builtin.copy:
    content: "{{ consul_keygen_result.stdout }}"
    dest: "{{ pki_root }}/consul_encrypt.key"
    mode: "0600"
  delegate_to: localhost
  when:
    - consul_encrypt | length == 0
    - consul_keygen_result.stdout is defined
  run_once: true

- name: Set consul_encrypt fact from generated key
  ansible.builtin.set_fact:
    consul_encrypt: "{{ consul_keygen_result.stdout }}"
  when:
    - consul_encrypt | length == 0
    - consul_keygen_result.stdout is defined
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['consul_servers'] + groups.get('consul_clients', []) }}"
  run_once: true

- name: Check if consul_encrypt key file exists
  ansible.builtin.stat:
    path: "{{ pki_root }}/consul_encrypt.key"
  register: consul_encrypt_file
  delegate_to: localhost
  when: consul_encrypt | length == 0

- name: Load consul_encrypt key from file
  ansible.builtin.slurp:
    src: "{{ pki_root }}/consul_encrypt.key"
  register: consul_encrypt_content
  delegate_to: localhost
  when:
    - consul_encrypt | length == 0
    - consul_encrypt_file.stat.exists | default(false)

- name: Set consul_encrypt fact from file
  ansible.builtin.set_fact:
    consul_encrypt: "{{ consul_encrypt_content.content | b64decode | trim }}"
  when:
    - consul_encrypt | length == 0
    - consul_encrypt_content.content is defined

- name: Check if Consul config file exists
  ansible.builtin.stat:
    path: "{{ consul_config_file }}"
  register: consul_config_stat
  become: true

- name: Read existing Consul configuration if present
  ansible.builtin.slurp:
    src: "{{ consul_config_file }}"
  register: consul_existing_config
  become: true
  when: consul_config_stat.stat.exists

- name: Extract encrypt key from existing config
  ansible.builtin.set_fact:
    consul_existing_encrypt_key: >-
      {%- if consul_existing_config.content is defined -%}
        {%- set decoded = consul_existing_config.content | b64decode | default('') -%}
        {%- set match = decoded | regex_search('encrypt\s*=\s*"([^"]+)"', '\\1') -%}
        {{ (match | first) if match else '' }}
      {%- else -%}
        {{ '' }}
      {%- endif -%}
  when: consul_config_stat.stat.exists | default(false)

- name: Detect encrypt key change
  ansible.builtin.set_fact:
    consul_encrypt_changed: >-
      {{
        (consul_existing_encrypt_key | default('') | length > 0)
        and (consul_existing_encrypt_key != consul_encrypt)
      }}
  when: consul_config_stat.stat.exists | default(false)

- name: Stop Consul before clearing data (encrypt key changed)
  ansible.builtin.systemd:
    name: consul
    state: stopped
  become: true
  when:
    - consul_encrypt_changed | default(false)
    - consul_server | default(false)

- name: Clear Consul data directory (encrypt key changed)
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: absent
  become: true
  when:
    - consul_encrypt_changed | default(false)
    - consul_server | default(false)

- name: Recreate Consul data directory
  ansible.builtin.file:
    path: "{{ consul_data_dir }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  become: true
  when:
    - consul_encrypt_changed | default(false)
    - consul_server | default(false)

- name: Create Consul directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0750"
  loop:
    - "{{ consul_data_dir }}"
    - "{{ consul_config_dir }}"
    - "{{ consul_tls_dir }}"
  become: true

- name: Verify Consul TLS files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  register: consul_tls_check
  failed_when: not consul_tls_check.stat.exists
  loop:
    - "{{ consul_tls_ca_src }}"
    - "{{ consul_tls_cert_src }}"
    - "{{ consul_tls_key_src }}"
  when: consul_tls_enabled

- name: Copy Consul TLS CA
  ansible.builtin.copy:
    src: "{{ consul_tls_ca_src }}"
    dest: "{{ consul_tls_dir }}/ca.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  when: consul_tls_enabled
  become: true
  notify: Restart consul

- name: Copy Consul TLS certificate
  ansible.builtin.copy:
    src: "{{ consul_tls_cert_src }}"
    dest: "{{ consul_tls_dir }}/cert.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0644"
  when: consul_tls_enabled
  become: true
  notify: Restart consul

- name: Copy Consul TLS key
  ansible.builtin.copy:
    src: "{{ consul_tls_key_src }}"
    dest: "{{ consul_tls_dir }}/key.pem"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: "0600"
  when: consul_tls_enabled
  become: true
  no_log: true
  notify: Restart consul

- name: Configure and start Consul service
  block:
    - name: Backup existing Consul configuration
      ansible.builtin.copy:
        src: "{{ consul_config_file }}"
        dest: "{{ consul_config_file }}.backup"
        remote_src: true
        mode: preserve
      when: consul_config_file is file
      failed_when: false
      become: true

    - name: Render Consul configuration
      ansible.builtin.template:
        src: consul.hcl.j2
        dest: "{{ consul_config_file }}"
        owner: "{{ consul_user }}"
        group: "{{ consul_group }}"
        mode: "0640"
      notify: Restart consul
      become: true
      no_log: true

    - name: Validate Consul configuration
      ansible.builtin.command: consul validate {{ consul_config_dir }}
      changed_when: false
      become: true

    - name: Enable and start Consul
      ansible.builtin.systemd:
        name: consul
        enabled: true
        state: started
      become: true

    - name: Apply Consul config changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for Consul to be ready
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ consul_https_port }}/v1/status/leader"
        ca_path: "{{ consul_tls_dir }}/ca.pem"
        client_cert: "{{ consul_tls_dir }}/cert.pem"
        client_key: "{{ consul_tls_dir }}/key.pem"
        return_content: true
        status_code: 200
        validate_certs: true
      register: consul_ready
      until: consul_ready.status == 200
      retries: 30
      delay: 2
      become: true
      when: consul_tls_enabled

  rescue:
    - name: Restore previous Consul configuration
      ansible.builtin.copy:
        src: "{{ consul_config_file }}.backup"
        dest: "{{ consul_config_file }}"
        remote_src: true
        mode: preserve
      when: consul_config_file is file
      failed_when: false
      become: true

    - name: Restart Consul after restoration
      ansible.builtin.systemd:
        name: consul
        state: restarted
      become: true
      failed_when: false

    - name: Fail with descriptive message
      ansible.builtin.fail:
        msg: "Consul configuration or startup failed. Previous configuration restored."

  always:
    - name: Remove backup file
      ansible.builtin.file:
        path: "{{ consul_config_file }}.backup"
        state: absent
      become: true
      failed_when: false
