---
- name: Ensure nomad group
  ansible.builtin.group:
    name: "{{ nomad_group }}"
    system: true
  become: true

- name: Ensure nomad user
  ansible.builtin.user:
    name: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Nomad package
  ansible.builtin.package:
    name: "{{ nomad_package }}"
    state: present
  become: true

- name: Create Nomad directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0750"
  loop:
    - "{{ nomad_data_dir }}"
    - "{{ nomad_config_dir }}"
    - "{{ nomad_tls_dir }}"
    - "{{ nomad_consul_tls_dir }}"
  become: true

- name: Verify Nomad TLS files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  register: nomad_tls_check
  failed_when: not nomad_tls_check.stat.exists
  loop:
    - "{{ nomad_tls_ca_src }}"
    - "{{ nomad_tls_cert_src }}"
    - "{{ nomad_tls_key_src }}"
  when: nomad_tls_enabled

- name: Copy Nomad TLS CA
  ansible.builtin.copy:
    src: "{{ nomad_tls_ca_src }}"
    dest: "{{ nomad_tls_dir }}/ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_tls_enabled
  become: true

- name: Copy Nomad TLS certificate
  ansible.builtin.copy:
    src: "{{ nomad_tls_cert_src }}"
    dest: "{{ nomad_tls_dir }}/cert.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_tls_enabled
  become: true

- name: Copy Nomad TLS key
  ansible.builtin.copy:
    src: "{{ nomad_tls_key_src }}"
    dest: "{{ nomad_tls_dir }}/key.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0600"
  when: nomad_tls_enabled
  become: true
  no_log: true

- name: Copy Consul TLS CA for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_ca_src }}"
    dest: "{{ nomad_consul_tls_dir }}/ca.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_consul_tls_enabled
  become: true

- name: Copy Consul TLS certificate for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_cert_src }}"
    dest: "{{ nomad_consul_tls_dir }}/cert.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0644"
  when: nomad_consul_tls_enabled
  become: true

- name: Copy Consul TLS key for Nomad
  ansible.builtin.copy:
    src: "{{ nomad_consul_tls_key_src }}"
    dest: "{{ nomad_consul_tls_dir }}/key.pem"
    owner: "{{ nomad_user }}"
    group: "{{ nomad_group }}"
    mode: "0600"
  when: nomad_consul_tls_enabled
  become: true
  no_log: true

- name: Configure and start Nomad service
  block:
    - name: Backup existing Nomad configuration
      ansible.builtin.copy:
        src: "{{ nomad_config_file }}"
        dest: "{{ nomad_config_file }}.backup"
        remote_src: true
        mode: preserve
      when: nomad_config_file is file
      failed_when: false
      become: true

    - name: Render Nomad configuration
      ansible.builtin.template:
        src: nomad.hcl.j2
        dest: "{{ nomad_config_file }}"
        owner: "{{ nomad_user }}"
        group: "{{ nomad_group }}"
        mode: "0640"
      notify: Restart nomad
      become: true
      no_log: true

    - name: Validate Nomad configuration
      ansible.builtin.command: nomad config validate {{ nomad_config_file }}
      changed_when: false
      become: true

    - name: Enable and start Nomad
      ansible.builtin.systemd:
        name: nomad
        enabled: true
        state: started
      become: true

    - name: Wait for Nomad to be ready
      ansible.builtin.uri:
        url: "{{ 'https' if nomad_tls_enabled else 'http' }}://127.0.0.1:4646/v1/agent/self"
        validate_certs: false
        status_code: 200
      register: nomad_ready
      until: nomad_ready.status == 200
      retries: 30
      delay: 2

  rescue:
    - name: Restore previous Nomad configuration
      ansible.builtin.copy:
        src: "{{ nomad_config_file }}.backup"
        dest: "{{ nomad_config_file }}"
        remote_src: true
        mode: preserve
      when: nomad_config_file is file
      failed_when: false
      become: true

    - name: Restart Nomad after restoration
      ansible.builtin.systemd:
        name: nomad
        state: restarted
      become: true
      failed_when: false

    - name: Fail with descriptive message
      ansible.builtin.fail:
        msg: "Nomad configuration or startup failed. Previous configuration restored."

  always:
    - name: Remove backup file
      ansible.builtin.file:
        path: "{{ nomad_config_file }}.backup"
        state: absent
      become: true
      failed_when: false
