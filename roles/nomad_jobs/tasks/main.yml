---
- name: Find Nomad job files
  ansible.builtin.find:
    paths: "{{ nomad_jobs_dir }}"
    patterns: "*.hcl"
    file_type: file
    recurse: true
  delegate_to: localhost
  run_once: true
  register: nomad_jobs_files
  when: nomad_jobs_enabled

- name: Build Nomad CLI environment
  ansible.builtin.set_fact:
    nomad_jobs_env: "{{ {'NOMAD_ADDR': nomad_jobs_nomad_addr} }}"
  run_once: true
  when: nomad_jobs_enabled

- name: Build Nomad job relative paths
  ansible.builtin.set_fact:
    nomad_jobs_relative_paths: >-
      {{
        nomad_jobs_files.files
        | map(attribute='path')
        | map('regex_replace', '^' ~ nomad_jobs_dir ~ '/?', '')
        | list
      }}
  run_once: true
  when: nomad_jobs_enabled

- name: Append Nomad token to environment when provided
  ansible.builtin.set_fact:
    nomad_jobs_env: "{{ nomad_jobs_env | combine({'NOMAD_TOKEN': nomad_jobs_nomad_token}) }}"
  run_once: true
  when:
    - nomad_jobs_enabled
    - nomad_jobs_nomad_token | length > 0

- name: Append Nomad CA cert when TLS is enabled
  ansible.builtin.set_fact:
    nomad_jobs_env: "{{ nomad_jobs_env | combine({'NOMAD_CACERT': nomad_tls_dir + '/ca.pem'}) }}"
  run_once: true
  when:
    - nomad_jobs_enabled
    - nomad_tls_enabled | default(false)

- name: Ensure Nomad jobs temp directory
  ansible.builtin.file:
    path: "{{ nomad_jobs_tmp_dir }}"
    state: directory
    mode: "0750"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  when: nomad_jobs_enabled

- name: Ensure Nomad jobs subdirectories
  ansible.builtin.file:
    path: "{{ nomad_jobs_tmp_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_relative_paths | map('dirname') | reject('equalto', '.') | unique | list }}"
  when:
    - nomad_jobs_enabled
    - nomad_jobs_relative_paths is defined

- name: Copy Nomad job files
  vars:
    nomad_job_rel_path: "{{ item.path | regex_replace('^' ~ nomad_jobs_dir ~ '/?', '') }}"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ nomad_jobs_tmp_dir }}/{{ nomad_job_rel_path }}"
    mode: "0644"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_files.files | default([]) }}"
  when: nomad_jobs_enabled

- name: Plan Nomad jobs
  vars:
    nomad_job_rel_path: "{{ item.path | regex_replace('^' ~ nomad_jobs_dir ~ '/?', '') }}"
  ansible.builtin.command: "nomad job plan {{ nomad_jobs_tmp_dir }}/{{ nomad_job_rel_path }}"
  environment: "{{ nomad_jobs_env }}"
  register: nomad_jobs_plan
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_files.files | default([]) }}"
  when: nomad_jobs_enabled
  failed_when: item.rc not in [0, 255]
  changed_when: false
  become: true

- name: Run Nomad jobs
  vars:
    nomad_job_rel_path: "{{ item.item.path | regex_replace('^' ~ nomad_jobs_dir ~ '/?', '') }}"
  ansible.builtin.command: "nomad job run {{ nomad_jobs_tmp_dir }}/{{ nomad_job_rel_path }}"
  environment: "{{ nomad_jobs_env }}"
  changed_when: "'Deployment ID' in item.stdout or 'Job registration successful' in item.stdout"
  delegate_to: "{{ nomad_jobs_delegate }}"
  run_once: true
  loop: "{{ nomad_jobs_plan.results }}"
  throttle: 3
  when: nomad_jobs_enabled and item.rc in [0, 255]
  become: true
