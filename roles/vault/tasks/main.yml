---
- name: Ensure vault group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    system: true
  become: true

- name: Ensure vault user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install Vault package
  ansible.builtin.package:
    name: "{{ vault_package }}"
    state: present
  become: true

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0750"
  loop:
    - "{{ vault_config_dir }}"
    - "{{ vault_data_dir }}"
    - "{{ vault_tls_dir }}"
  become: true

- name: Verify Vault TLS files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  register: vault_tls_check
  failed_when: not vault_tls_check.stat.exists
  loop:
    - "{{ vault_tls_ca_src }}"
    - "{{ vault_tls_cert_src }}"
    - "{{ vault_tls_key_src }}"
  when: vault_tls_enabled

- name: Copy Vault TLS CA
  ansible.builtin.copy:
    src: "{{ vault_tls_ca_src }}"
    dest: "{{ vault_tls_dir }}/ca.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0644"
  when: vault_tls_enabled
  become: true

- name: Copy Vault TLS certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_cert_src }}"
    dest: "{{ vault_tls_dir }}/cert.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0644"
  when: vault_tls_enabled
  become: true

- name: Copy Vault TLS key
  ansible.builtin.copy:
    src: "{{ vault_tls_key_src }}"
    dest: "{{ vault_tls_dir }}/key.pem"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0600"
  when: vault_tls_enabled
  become: true
  no_log: true

- name: Configure and start Vault service
  block:
    - name: Backup existing Vault configuration
      ansible.builtin.copy:
        src: "{{ vault_config_file }}"
        dest: "{{ vault_config_file }}.backup"
        remote_src: true
        mode: preserve
      when: vault_config_file is file
      failed_when: false
      become: true

    - name: Render Vault configuration
      ansible.builtin.template:
        src: vault.hcl.j2
        dest: "{{ vault_config_file }}"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0640"
      notify: Restart vault
      become: true
      no_log: true

    - name: Validate Vault configuration
      ansible.builtin.command: vault server -config={{ vault_config_file }} -test
      changed_when: false
      become: true

    - name: Ensure systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/vault.service.d
        state: directory
        mode: "0755"
      become: true

    - name: Configure systemd override for Vault
      ansible.builtin.copy:
        dest: /etc/systemd/system/vault.service.d/override.conf
        content: |
          [Service]
          LimitMEMLOCK=infinity
          Environment="VAULT_API_ADDR={{ vault_api_addr }}"
          Environment="VAULT_ADDR={{ vault_api_addr }}"
        mode: "0644"
      notify:
        - Reload systemd
        - Restart vault
      become: true

    - name: Enable and start Vault
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: started
      become: true

    - name: Wait for Vault to be ready
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/sys/health"
        validate_certs: "{{ vault_tls_enabled | default(true) }}"
        ca_path: "{{ (vault_tls_enabled | default(true)) | ternary(vault_tls_dir + '/ca.pem', omit) }}"
        status_code: [200, 429, 501, 503]
      register: vault_ready
      until: vault_ready.status in [200, 429, 501, 503]
      retries: 30
      delay: 2

  rescue:
    - name: Restore previous Vault configuration
      ansible.builtin.copy:
        src: "{{ vault_config_file }}.backup"
        dest: "{{ vault_config_file }}"
        remote_src: true
        mode: preserve
      when: vault_config_file is file
      failed_when: false
      become: true

    - name: Restart Vault after restoration
      ansible.builtin.systemd:
        name: vault
        state: restarted
      become: true
      failed_when: false

    - name: Fail with descriptive message
      ansible.builtin.fail:
        msg: "Vault configuration or startup failed. Previous configuration restored."

  always:
    - name: Remove backup file
      ansible.builtin.file:
        path: "{{ vault_config_file }}.backup"
        state: absent
      become: true
      failed_when: false
