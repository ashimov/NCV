---
- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts["os_family"] == "Debian"
  become: true
  retries: 3
  delay: 5
  register: common_apt_cache_update
  until: common_apt_cache_update is success

- name: Install base packages (Debian)
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present
  when: ansible_facts["os_family"] == "Debian"
  become: true

- name: Reset DNF cache (RedHat)
  ansible.builtin.command: dnf -y clean all
  changed_when: false
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Refresh DNF cache (RedHat)
  ansible.builtin.command: dnf -y makecache
  changed_when: false
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Install base packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ common_packages_redhat }}"
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Add HashiCorp GPG key (Debian)
  block:
    - name: Download HashiCorp GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /tmp/hashicorp.gpg
        mode: "0644"
      when: ansible_facts["os_family"] == "Debian"
      become: true

    - name: Create keyring from HashiCorp GPG key
      ansible.builtin.command: >-
        gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg /tmp/hashicorp.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
      when: ansible_facts["os_family"] == "Debian"
      become: true

    - name: Ensure keyring permissions
      ansible.builtin.file:
        path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
        mode: "0644"
      when: ansible_facts["os_family"] == "Debian"
      become: true

    - name: Remove temporary HashiCorp key file
      ansible.builtin.file:
        path: /tmp/hashicorp.gpg
        state: absent
      when: ansible_facts["os_family"] == "Debian"
      become: true

- name: Add HashiCorp repository (Debian)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]
      https://apt.releases.hashicorp.com {{ ansible_facts["distribution_release"] }} main
    state: present
    update_cache: false
  when: ansible_facts["os_family"] == "Debian"
  become: true
  retries: 3
  delay: 5
  register: common_hashicorp_repo
  until: common_hashicorp_repo is success

- name: Update apt cache after adding HashiCorp repo (Debian)
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts["os_family"] == "Debian"
    - common_hashicorp_repo is changed
  become: true
  retries: 3
  delay: 5

- name: Add HashiCorp repository (RedHat)
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    enabled: true
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Import HashiCorp GPG key (RedHat)
  ansible.builtin.rpm_key:
    key: https://rpm.releases.hashicorp.com/gpg
    state: present
  when: ansible_facts["os_family"] == "RedHat"
  become: true

- name: Refresh DNF cache after HashiCorp repo (RedHat)
  ansible.builtin.command: dnf -y makecache --disablerepo="*" --enablerepo="hashicorp"
  changed_when: false
  when: ansible_facts["os_family"] == "RedHat"
  become: true
- name: Configure logrotate for services
  ansible.builtin.include_tasks: logrotate.yml
  tags: [logrotate]
