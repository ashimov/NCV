---
load_balancer_enabled: false
load_balancer_provider: aws  # aws | gcp | manual
load_balancer_name: "{{ cluster_name }}-lb"
load_balancer_output_dir: "{{ playbook_dir }}/docs/lb-plans"

load_balancer_listeners:
  - {name: consul_http, port: 8500, protocol: tcp, target_port: 8500, target_group: consul}
  - {name: consul_https, port: 8501, protocol: tcp, target_port: 8501, target_group: consul}
  - {name: consul_grpc_tls, port: 8502, protocol: tcp, target_port: 8502, target_group: consul}
  - {name: nomad_http, port: 4646, protocol: tcp, target_port: 4646, target_group: nomad}
  - {name: nomad_rpc, port: 4647, protocol: tcp, target_port: 4647, target_group: nomad}
  - {name: vault_http, port: 8200, protocol: tcp, target_port: 8200, target_group: vault}
  - {name: vault_cluster, port: 8201, protocol: tcp, target_port: 8201, target_group: vault}

load_balancer_targets:
  consul: "{{ groups['consul_servers'] | default([]) }}"
  nomad: "{{ groups['nomad_servers'] | default([]) }}"
  vault: "{{ groups['vault_servers'] | default([]) }}"
