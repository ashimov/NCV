---
cluster_name: ncv
cluster_domain: ashimov.com

# Common network defaults (override per-host if needed)
node_ip: >-
  {{
    ansible_host
      | default(ansible_facts.get('default_ipv4', {}).get('address', ''))
      | default(inventory_hostname)
  }}

# PKI defaults
pki_generate: true
pki_root: "{{ playbook_dir }}/pki"
pki_python_interpreter: "/opt/homebrew/bin/python3"
pki_target_groups:
  - consul_servers
  - consul_clients
  - nomad_servers
  - nomad_clients
  - vault_servers
pki_ca_common_name: "{{ cluster_name }}-ca"
pki_org: "ASHIMOV"
pki_org_unit: "IT"
pki_country: "KZ"

# Consul defaults
consul_datacenter: dc1
consul_data_dir: /opt/consul
consul_config_dir: /etc/consul.d
consul_tls_dir: /etc/consul.d/tls
consul_bind_addr: "{{ node_ip }}"
consul_advertise_addr: "{{ node_ip }}"
consul_client_addr: "0.0.0.0"
consul_retry_join: "{{ groups['consul_servers'] | default([]) | map('extract', hostvars, 'node_ip') | list }}"
consul_retry_join_cloud_enabled: false
consul_retry_join_cloud: []
consul_ui: true
consul_connect_enabled: true
consul_acl_enabled: true
consul_acl_default_policy: deny
consul_acl_down_policy: extend-cache
consul_encrypt: ""

# Nomad defaults
nomad_region: global
nomad_datacenter: dc1
nomad_data_dir: /opt/nomad
nomad_config_dir: /etc/nomad.d
nomad_tls_dir: /etc/nomad.d/tls
nomad_bind_addr: "{{ node_ip }}"
nomad_advertise_addr: "{{ node_ip }}"
nomad_retry_join: "{{ groups['nomad_servers'] | default([]) | map('extract', hostvars, 'node_ip') | list }}"
nomad_retry_join_cloud_enabled: false
nomad_retry_join_cloud: []
nomad_consul_enabled: true
nomad_consul_address: >-
  127.0.0.1:{{
    (nomad_consul_tls_enabled | bool)
      | ternary(consul_https_port, consul_http_port)
  }}
nomad_enable_raw_exec: false
nomad_acl_enabled: false
nomad_consul_tls_enabled: "{{ consul_tls_enabled }}"
nomad_consul_tls_dir: /etc/nomad.d/consul-tls
nomad_consul_tls_ca_src: "{{ consul_tls_ca_src }}"
nomad_consul_tls_cert_src: "{{ consul_tls_cert_src }}"
nomad_consul_tls_key_src: "{{ consul_tls_key_src }}"

# Vault defaults
vault_config_dir: /etc/vault.d
vault_data_dir: /opt/vault
vault_tls_dir: /etc/vault.d/tls
vault_api_addr: "https://{{ node_ip }}:8200"
vault_cluster_addr: "https://{{ node_ip }}:8201"
vault_listener_address: "0.0.0.0:8200"
vault_cluster_listen_address: "0.0.0.0:8201"
vault_storage_backend: consul  # consul | raft
vault_ui: true
vault_disable_mlock: false

# TLS defaults for services (pki-generated by default)
consul_tls_enabled: true
consul_tls_source: pki
consul_tls_ca_src: "{{ pki_root }}/ca/ca.pem"
consul_tls_cert_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/cert.pem"
consul_tls_key_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/key.pem"

nomad_tls_enabled: true
nomad_tls_source: pki
nomad_tls_ca_src: "{{ pki_root }}/ca/ca.pem"
nomad_tls_cert_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/cert.pem"
nomad_tls_key_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/key.pem"

vault_tls_enabled: true
vault_tls_source: pki
vault_tls_ca_src: "{{ pki_root }}/ca/ca.pem"
vault_tls_cert_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/cert.pem"
vault_tls_key_src: "{{ pki_root }}/hosts/{{ inventory_hostname }}/key.pem"
vault_tls_require_client_cert: false

# Vault storage (consul)
vault_consul_address: >-
  127.0.0.1:{{
    (consul_tls_enabled | bool)
      | ternary(consul_https_port, consul_http_port)
  }}
vault_consul_token: ""

# Vault auto-unseal (optional)
vault_seal_type: none  # none | awskms | gcpckms | transit
vault_seal_config: {}

# Firewall defaults
firewall_enabled: false
firewall_backend: auto
firewall_allow_cidrs: []

# Load balancer plan (optional)
load_balancer_enabled: false
load_balancer_provider: aws
# Nomad jobs
nomad_jobs_enabled: false
nomad_jobs_dir: "{{ playbook_dir }}/jobs"
nomad_jobs_tmp_dir: /var/tmp/nomad-jobs
nomad_jobs_nomad_addr: "https://{{ node_ip }}:4646"
nomad_jobs_nomad_token: ""
